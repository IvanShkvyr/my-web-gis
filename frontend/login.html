<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MyWebGIS — Login</title>
        <meta name="description" content="Log in to your account">

        <link rel="icon" href="/media/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,700;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/style.css">

        <script src="/js/auth.js"></script>
        <script src="/components/header.js" defer></script>
    </head>
    <body>

        <header id="site-header" class="top-line"></header>

        <main class="auth-page">
            <div class="container">
                <div class="auth-card ">
                    <h1 class="ayth-card title">Welcome back</h1>
                    <p class="ayth-card subtitle">No account yet? 
                        <a href="/register.html">Sing up</a>
                    </p>

                    <div class="alert alert--error" id="error-msg" role="alert"></div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        />
                    </div>
                    <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    />
                    </div>
                    <button class="btn-primary" id="submit-btn">Log in</button>
                </div>

            </div>
        </main>

    </body>

  <script>
  if (Auth.isLoggedIn()) {
    window.location.replace('/index.html');
  }

  const emailInput    = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn     = document.getElementById('submit-btn');
  const errorMsg      = document.getElementById('error-msg');

  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
  }

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.textContent = isLoading ? 'Logging in...' : 'Log in';
  }

  function getRedirectTarget() {
    const params = new URLSearchParams(window.location.search);
    const next   = params.get('next');
    return (next && next.startsWith('/')) ? next : '/index.html';
  }

  submitBtn.addEventListener('click', async () => {
    hideError();
    const email    = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }

    setLoading(true);
    try {
      await Auth.login(email, password);
      window.location.replace(getRedirectTarget());
    } catch (err) {
      showError(err.message);
      passwordInput.value = '';
    } finally {
      setLoading(false);
    }
  });

  function hideError() {
    errorMsg.style.display = 'none';
  }

  [emailInput, passwordInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
  });
</script>

</html>
