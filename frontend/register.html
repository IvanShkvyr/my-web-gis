<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MyWebGIS — Sign up</title>
        <meta name="description" content="Create a new account">

        <link rel="icon" href="/media/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,700;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/style.css">

        <script src="/js/auth.js"></script>
        <script src="/components/header.js" defer></script>
    </head>
    <body>
        <header id="site-header" class="top-line"></header>
        <main class="auth-page">
            <div class="container">
                <div class="auth-card">
                    <h1 class="auth-card__title">Create account</h1>
                    <p class="auth-card__subtitle">
                    Already have one?
                    <a href="/login.html">Log in</a>
                    </p>
            
                    <div class="alert alert--error"   id="error-msg"   role="alert"></div>
                    <div class="alert alert--success" id="success-msg" role="status"></div>
            
                    <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="your_name"
                        autocomplete="username"
                        required
                    />
                    </div>
            
                    <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    />
                    </div>
            
                    <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                    />
                    <p class="hint">At least 8 characters.</p>
                    </div>
            
                    <button class="btn-primary" id="submit-btn">Create account</button>
                </div>
            </div>
        </main>
    <script>
      // If already logged in — no need to register again
      if (Auth.isLoggedIn()) {
        window.location.replace('/index.html');
      }
 
      const usernameInput = document.getElementById('username');
      const emailInput    = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn     = document.getElementById('submit-btn');
      const errorMsg      = document.getElementById('error-msg');
      const successMsg    = document.getElementById('success-msg');
 
      function showError(message) {
        successMsg.style.display = 'none';
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
      }
 
      function showSuccess(message) {
        errorMsg.style.display = 'none';
        successMsg.textContent = message;
        successMsg.style.display = 'block';
      }
 
      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? 'Creating account...' : 'Create account';
      }
 
      submitBtn.addEventListener('click', async () => {
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
 
        const username = usernameInput.value.trim();
        const email    = emailInput.value.trim();
        const password = passwordInput.value;
 
        // Client-side validation
        if (!username || !email || !password) {
          showError('Please fill in all fields.');
          return;
        }
 
        if (password.length < 8) {
          showError('Password must be at least 8 characters.');
          return;
        }
 
        setLoading(true);
 
        try {
          await Auth.register(username, email, password);
 
          showSuccess('Account created! Logging you in…');
 
          // Automatically log the user in after registration
          await Auth.login(email, password);
          window.location.replace('/index.html');
 
        } catch (err) {
          showError(err.message);
          passwordInput.value = '';
 
        } finally {
          setLoading(false);
        }
      });
 
      [usernameInput, emailInput, passwordInput].forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitBtn.click();
        });
      });
    </script>
    </body>
</html>
