<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MyWebGIS — My Data</title>
        <meta name="description" content="Your collected telemetry data and analytics">

        <link rel="icon" href="/media/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,700;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/style.css">

        <script src="/js/auth.js"></script>
        <script> Auth.requireAuth(); </script> 
        <script src="/components/header.js" defer></script>
    </head>
    <body>
        <header id="site-header" class="top-line"></header>
        <main class="auth-page">
            <div class="container">
                <h1 class="hero-title">Coming soon</h1>

                <table id="data-table">
                <thead><tr><th>#</th><th>Time</th><th>Lat</th><th>Lon</th></tr></thead>
                <tbody></tbody>
                </table>
                <script>
                (async () => {
                    const res = await Auth.fetch('/api/v1/telemetry?limit=100');
                    if (!res.ok) { console.error('Load failed:', res.status); return; }
                    const page = await res.json();
                    document.querySelector('#data-table tbody').innerHTML = page.items.map(p =>
                    `<tr><td>${p.id}</td><td>${p.timestamp}</td>
                        <td>${p.latitude.toFixed(5)}</td><td>${p.longitude.toFixed(5)}</td></tr>`
                    ).join('');
                })();
                </script>

            </div>
        </main>

    </body>
</html>
